<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=500, shrink-to-fit=yes, maximum-scale=1, user-scalable=0" />
  <title>Product Catalog</title>
  <link rel="stylesheet" href="css/color.css">
  <!-- <link rel="stylesheet" href="/style.css"> -->
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div class="page-wrapper">
    <h1>Product <span class="pink">Catalog</span></h1>
    
    <div class="forms-container">
      <div class="circles">
        <svg class="circle" viewBox="0 0 12 12">
          <circle cx="6" cy="6" r="6" fill="#FE5E56"/>
        </svg>
        <svg class="circle yellow" viewBox="0 0 12 12">
          <circle cx="6" cy="6" r="6" fill="#FFC32D"/>
        </svg>
        <svg class="circle green" viewBox="0 0 12 12">
          <circle cx="6" cy="6" r="6" fill="#28C53F"/>
        </svg>
      </div>
      
      <div class="line">
        <input type="text" id="searchInput" class="main-text-area" placeholder="Поиск продуктов..." />
        <button onclick="search()">Поиск</button>
      </div>
      
      <div id="pagination" class="line"></div>
    </div>
    
    <div id="results" class="products-grid"></div>
  </div>

  <script>
    let currentPage = 1;
    let totalPages = 1;
    let currentQuery = '';

    async function fetchProducts(endpoint) {
      try {
        const res = await fetch(endpoint);
        const data = await res.json();
        
        const products = data.products || [data];
        totalPages = Math.ceil((data.total || products.length) / 10);
        
        displayProducts(products);
        renderPagination();
      } catch (error) {
        console.error('Error fetching products:', error);
        document.getElementById('results').innerHTML = '<p>Error loading products</p>';
      }
    }

    function displayProducts(products) {
      const container = document.getElementById('results');
      container.innerHTML = '';
      
      if (products.length === 0) {
        container.innerHTML = '<p class="no-products">No products found</p>';
        return;
      }
      
      products.forEach(p => {
        const productEl = document.createElement('div');
        productEl.className = 'product';
        productEl.innerHTML = `
          <img src="/images/product_${p.id}.jpg" alt="${p.title}">
          <h3>${p.title}</h3>
          <p class="price">$${p.price}</p>
          <p class="description">${p.description}</p>
        `;
        container.appendChild(productEl);
      });
    }

    function renderPagination() {
      const container = document.getElementById('pagination');
      container.innerHTML = '';
      
      if (totalPages <= 1) return;
      
      const maxVisiblePages = 5;
      let startPage = Math.max(1, currentPage - Math.floor(maxVisiblePages / 2));
      let endPage = Math.min(totalPages, startPage + maxVisiblePages - 1);
      
      if (endPage - startPage + 1 < maxVisiblePages) {
        startPage = Math.max(1, endPage - maxVisiblePages + 1);
      }
      
      if (currentPage > 1) {
        const prevBtn = document.createElement('button');
        prevBtn.textContent = '←';
        prevBtn.onclick = () => changePage(currentPage - 1);
        container.appendChild(prevBtn);
      }
      
      if (startPage > 1) {
        const firstBtn = document.createElement('button');
        firstBtn.textContent = '1';
        firstBtn.onclick = () => changePage(1);
        container.appendChild(firstBtn);
        
        if (startPage > 2) {
          const dots = document.createElement('span');
          dots.textContent = '...';
          container.appendChild(dots);
        }
      }
      
      for (let i = startPage; i <= endPage; i++) {
        const pageBtn = document.createElement('button');
        pageBtn.textContent = i;
        if (i === currentPage) {
          pageBtn.classList.add('active');
        }
        pageBtn.onclick = () => changePage(i);
        container.appendChild(pageBtn);
      }
      
      if (endPage < totalPages) {
        if (endPage < totalPages - 1) {
          const dots = document.createElement('span');
          dots.textContent = '...';
          container.appendChild(dots);
        }
        
        const lastBtn = document.createElement('button');
        lastBtn.textContent = totalPages;
        lastBtn.onclick = () => changePage(totalPages);
        container.appendChild(lastBtn);
      }
      
      if (currentPage < totalPages) {
        const nextBtn = document.createElement('button');
        nextBtn.textContent = '→';
        nextBtn.onclick = () => changePage(currentPage + 1);
        container.appendChild(nextBtn);
      }
    }

    function changePage(page) {
      currentPage = page;
      if (currentQuery) {
        fetchProducts(`/api/products/search?q=${encodeURIComponent(currentQuery)}&page=${currentPage}`);
      } else {
        fetchProducts(`/api/products?page=${currentPage}`);
      }
    }

    function search() {
      currentPage = 1;
      currentQuery = document.getElementById('searchInput').value.trim();
      if (currentQuery) {
        fetchProducts(`/api/products/search?q=${encodeURIComponent(currentQuery)}&page=${currentPage}`);
      } else {
        fetchProducts(`/api/products?page=${currentPage}`);
      }
    }

    fetchProducts('/api/products?page=1');
  </script>
</body>
</html>
